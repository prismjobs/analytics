[build] 
  command = "npm run build" 
    functions = "netlify/functions" 
    publish = "build" 
      
[functions] 
  node_bundler = "esbuild" 
  
[redirects] 
  from = "/*" 
  to = "/index.html" 
  status = 200 
  
[headers] for = "/*" 
  [headers.values] 
    X-Content-Type-Options = "nosniff" 
    X-Frame-Options = "DENY" 
    X-XSS-Protection = "1; mode=block" 
    Referrer-Policy = "strict-origin-when-cross-origin"


