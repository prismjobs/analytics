# netlify.toml

[build]
  command = "npm run build"
  functions = "netlify/functions"
  publish = "build"

# Variáveis de ambiente (defina no painel Netlify)
[env]
  [env.production]
    SUPABASE_URL = "" # Definir
    SUPABASE_SERVICE_KEY = "" # Definir
    SUPABASE_ANON_KEY = "" # Definir

# Reescrita para SPA React
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers de segurança
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Rate limiting nas functions (proteção contra abuso)
[[functions]]
  name = "parseAd"
  [functions.environment]
    TIMEOUT_MS = "30000"

[[functions]]
  name = "updateSnapshots"
  [functions.environment]
    TIMEOUT_MS = "120000"

[[functions]]
  name = "analytics"
  [functions.environment]
    TIMEOUT_MS = "60000"
